# Main experiment on a Colab GPU with 24 GB+ (L4 / A100): 7B in bf16. Mount Drive first.
# Keep this config for every 7B run (behavior, vectors, steering) so results stay comparable.
# On a free T4 (16 GB, no bf16) use configs/colab_t4.yaml (8-bit) instead -- but don't mix the two.
model_name: Qwen/Qwen2.5-7B-Instruct
device: cuda
dtype: bfloat16
load_in_8bit: false
batch_size: 32
output_dir: /content/drive/MyDrive/vnpronouns/outputs
